<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;600;700&display=swap');
  :root {
    --bg-dark: #0E3A57;
    --danger: #C0392B;
    --text: #FFFFFF; --muted: rgba(255,255,255,0.85);
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Karla', -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--bg-dark); color: var(--text); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 96px; display: flex; flex-direction: column; justify-content: center; }
  .page { position: absolute; bottom: 72px; right: 96px; font-size: 24px; color: var(--muted); }
  .badge { display: inline-flex; align-items: center; padding: 10px 22px; margin-bottom: 40px; border-radius: 999px; border: 1px solid var(--danger); background: rgba(192,57,43,0.16); color: #FF8A80; font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; width: fit-content; }
  .title { font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: 0.98; text-transform: uppercase; max-width: 900px; margin-bottom: 40px; }
  .body-line { font-size: 44px; line-height: 1.4; color: var(--muted); max-width: 820px; }
  .body-line strong { color: #fff; }
</style>
</head>
<body>
  <div class="slide">
    <div class="badge">Evitar</div>
    <div class="title">Las toallitas húmedas no son ideales</div>
    <div class="body-line">Un estudio en 10 residencias encontró que las toallitas con jabón se asociaron a <strong>más dermatitis</strong> — las toallitas secas fueron las más protectoras (p=0.001).</div>
    <div class="page">04 / 07</div>
  </div>
</body>
</html>
