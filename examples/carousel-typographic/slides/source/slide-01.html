<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;600;700&display=swap');
  :root {
    --bg-dark: #0E3A57;
    --primary: #1B6CA8; --accent: #D9642C; --secondary: #1D7A8C;
    --text: #FFFFFF; --muted: rgba(255,255,255,0.85);
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Karla', -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--bg-dark); color: var(--text); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 96px; display: flex; flex-direction: column; justify-content: center; }
  .handle { position: absolute; top: 64px; right: 64px; background: rgba(14,58,87,0.55); backdrop-filter: blur(6px); border-radius: 999px; padding: 10px 22px; }
  .handle span { font-family: var(--font-body); font-weight: 600; font-size: 22px; color: #fff; }
  .badge { display: inline-flex; align-items: center; padding: 10px 22px; margin-bottom: 40px; border-radius: 999px; border: 1px solid var(--accent); background: rgba(217,100,44,0.14); color: var(--accent); font-family: var(--font-body); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; width: fit-content; }
  .title { font-family: var(--font-display); font-weight: 400; font-size: 100px; line-height: 1.12; text-transform: uppercase; max-width: 940px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="handle"><span>@elpapadoctor</span></div>
    <div class="badge">Guía basada en evidencia</div>
    <div class="title">Cómo limpiarte bien el 🍑, según la ciencia</div>
  </div>
</body>
</html>
