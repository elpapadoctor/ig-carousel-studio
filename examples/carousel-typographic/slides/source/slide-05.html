<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;600;700&display=swap');
  :root {
    --bg-dark: #0E3A57;
    --accent: #D9642C;
    --text: #FFFFFF; --muted: rgba(255,255,255,0.85);
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Karla', -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--bg-dark); color: var(--text); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 96px; display: flex; flex-direction: column; justify-content: center; }
  .page { position: absolute; bottom: 72px; right: 96px; font-size: 24px; color: var(--muted); }
  .badge { display: inline-flex; align-items: center; padding: 10px 22px; margin-bottom: 40px; border-radius: 999px; border: 1px solid var(--accent); background: rgba(217,100,44,0.14); color: var(--accent); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; width: fit-content; }
  .title { font-family: var(--font-display); font-weight: 400; font-size: 84px; line-height: 0.98; text-transform: uppercase; max-width: 900px; margin-bottom: 40px; }
  .body-line { font-size: 44px; line-height: 1.4; color: var(--muted); max-width: 820px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="badge">Un dato real</div>
    <div class="title">El bidet sí reduce bacterias</div>
    <div class="body-line">En 32 voluntarios, el conteo bacteriano en las manos bajó de ~39.499 a ~4.146 UFC tras usar bidet (p&lt;0.00001). Pero: evitar presión alta o uso prolongado — puede irritar.</div>
    <div class="page">05 / 07</div>
  </div>
</body>
</html>
