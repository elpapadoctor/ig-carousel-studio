<!doctype html>
<!--
  Ejemplo variante (b) — foto + gradiente, caso real: @elpapadoctor.
  Foto propia (s7-foam.jpg) tratada con duotone + fade + grain de la marca.
-->
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;600;700&display=swap');
  :root {
    --bg-dark: #0E3A57;
    --primary: #1B6CA8; --accent: #D9642C;
    --text: #FFFFFF; --muted: rgba(255,255,255,0.85);
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Karla', -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--bg-dark); color: var(--text); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; filter: contrast(1.05) saturate(0.9); }
  .duotone {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(27,108,168,0.12) 0%, transparent 30%),
      radial-gradient(ellipse at 80% 8%, rgba(27,108,168,0.4) 0%, transparent 50%),
      linear-gradient(195deg, rgba(14,58,87,0.28) 0%, transparent 45%);
    mix-blend-mode: screen;
  }
  .fade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, transparent 26%, rgba(14,58,87,0.7) 50%, rgba(14,58,87,0.97) 76%, var(--bg-dark) 100%);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.4'/></svg>");
    opacity: 0.10; mix-blend-mode: overlay;
  }
  .content { position: absolute; left: 64px; right: 64px; bottom: 72px; }
  .title { font-family: var(--font-display); font-weight: 400; font-size: 96px; line-height: 0.92; text-transform: uppercase; max-width: 900px; margin-bottom: 32px; }
  blockquote { font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: 1.1; text-transform: uppercase; color: var(--accent); max-width: 900px; margin-bottom: 8px; }
  .body-line { font-family: var(--font-body); font-size: 36px; font-weight: 400; color: var(--muted); max-width: 780px; line-height: 1.4; margin-top: 24px; }
  .handle { position: absolute; top: 64px; right: 64px; background: rgba(14,58,87,0.55); backdrop-filter: blur(6px); border-radius: 999px; padding: 8px 18px; }
  .handle span { font-family: var(--font-body); font-weight: 600; font-size: 22px; color: #fff; }
</style>
</head>
<body>
  <div class="slide">
    <img class="photo" src="s7-foam.jpg" alt="" />
    <div class="duotone"></div>
    <div class="fade"></div>
    <div class="grain"></div>
    <div class="handle"><span>@elpapadoctor</span></div>
    <div class="content">
      <div class="title">La regla simple</div>
      <blockquote>"Agua tibia, sin jabón, y secar a toques."</blockquote>
      <div class="body-line">Si te sirvió, guárdalo — y compártelo antes de que alguien siga usando toallitas perfumadas.</div>
    </div>
  </div>
</body>
</html>
